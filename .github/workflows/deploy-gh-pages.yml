# .github/workflows/deploy-gh-pages.yml
# -----------------------------------------------------------------------------
# This is a GitHub Actions "workflow" - a script GitHub runs for you
# automatically. This one builds the React app and publishes it to
# GitHub Pages every time you push to the "main" branch.
#
# ONE-TIME SETUP (do this in the GitHub repository, not in code):
#   1. Go to your repo on GitHub -> Settings -> Pages.
#   2. Under "Build and deployment" -> "Source", choose "GitHub Actions".
#      (You do NOT need to pick a branch like "gh-pages" - this workflow
#      handles publishing for you.)
#   3. Push a commit to "main" and check the "Actions" tab to watch it deploy.
#   4. Your site will be live at:
#      https://<your-github-username>.github.io/Lubricant-website/
#
# If you rename the repository, also update GITHUB_REPO_NAME in
# frontend/vite.config.js to match the new name.

name: Deploy frontend to GitHub Pages

# Run this workflow automatically whenever code is pushed to "main",
# or manually from the GitHub "Actions" tab ("Run workflow" button).
on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Permissions the workflow needs in order to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one deployment to run at a time; if a new one starts,
# don't cancel a deployment that's already in progress.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # Job 1: check out the code, install dependencies, and build the app.
  # ---------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build the site (GitHub Pages sub-path base URL)
        working-directory: ./frontend
        run: npm run build:ghpages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Upload the built static files (frontend/dist) as a Pages artifact.
      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist

  # ---------------------------------------------------------------------
  # Job 2: publish the artifact from the build job to GitHub Pages.
  # ---------------------------------------------------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
