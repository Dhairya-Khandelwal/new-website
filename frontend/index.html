<!--
  index.html
  -----------------------------------------------------------------------
  This is the ONE html page the browser ever loads. React then takes over
  and swaps content in and out of the <div id="root"> below as the user
  navigates, without ever asking the server for a new page. This is what
  makes the site work as a "single-page app" (SPA) and is why hosts like
  GitHub Pages / Cloudflare Pages only need to serve this one file.

  Vite automatically rewrites the "/favicon.svg" and "/src/main.jsx" paths
  below to include the correct base path at build time (see the "base"
  option explained in vite.config.js), so you normally don't need to edit
  those paths yourself.
-->
<!doctype html>
<html lang="en">
  <head>
    <!-- Character encoding - keep this as UTF-8. -->
    <meta charset="UTF-8" />
    <!-- Browser tab icon. The actual file lives in /public/favicon.svg -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Makes the site render at a readable size on mobile devices. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Text shown in the browser tab / bookmark title. -->
    <title>lubricant-website</title>
  </head>
  <body>
    <!-- React mounts the entire application inside this empty <div>. -->
    <div id="root"></div>
    <!-- Loads our React app's entry point (see src/main.jsx). -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
